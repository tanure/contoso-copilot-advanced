name: Publish Lab Campus

on:
  push:
    branches: [main]
    paths:
      - 'campus/**'
      - 'labs/*/README.md'
      - 'docs/images/**'
      - 'scripts/campus/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-campus-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Template-created participant repositories should not deploy on push.
    if: github.ref == 'refs/heads/main' && (github.repository == 'tanure/contoso-copilot-advanced' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - name: Build the campus with lab instructions and images
        run: |
          npm ci --prefix scripts/campus --ignore-scripts
          node scripts/campus/build.mjs "$RUNNER_TEMP/campus"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/campus
      - uses: actions/deploy-pages@v4
        id: deployment
